<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LegalMinds</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --light: #f8fafc;
      --gray: #64748b;
      --text-dark: #0f172a;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #e0f2fe 0, #f8fafc 45%, #ffffff 80%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 40px;
      border-bottom: 1px solid rgba(226,232,240,0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      background: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(255,255,255,0));
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: .12em;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-dark);
    }
    .logo-dot {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      background: linear-gradient(135deg, #2563eb, #22c55e);
    }
    .logo span { color: var(--blue); }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { margin: 0 0 8px; font-size: 1.8rem; font-weight: 800; text-align: center; }
    .subtitle { text-align: center; color: var(--gray); margin-bottom: 32px; font-size: 0.95rem; }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.2s;
      background: #f8fafc;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #1d4ed8; }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--gray);
    }
    .signup-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <div class="logo-dot"></div>
      LEGAL<span>MINDS</span>
    </a>
    <div style="font-size: 0.9rem; color: var(--gray);">Login Desk</div>
  </header>

  <main>
    <div class="card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Access your Legal Minds portal to manage and review case actions.</p>

      <div id="errorBox" class="error-box"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email or Username</label>
          <input type="text" id="email" placeholder="e.g., sarah" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn-submit">Sign In →</button>
      </form>

      <div class="signup-link">
        New student? <a href="signup.html">Register here</a>
      </div>
    </div>
  </main>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errorBox = document.getElementById("errorBox");
      errorBox.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("token", data.access_token);
          localStorage.setItem("role", data.role);
          localStorage.setItem("username", email); // Cache email/username locally

          // Redirect based on role
          if (data.role.toLowerCase() === "student") {
            window.location.href = "student/dashboard.html";
          } else if (data.role.toLowerCase() === "lawyer") {
            window.location.href = "lawyer/lawyer.html";
          } else {
            window.location.href = "index.html";
          }
        } else {
          errorBox.textContent = data.detail || "Authentication failed. Please verify credentials.";
          errorBox.style.display = "block";
        }
      } catch (err) {
        errorBox.textContent = "Unable to connect to the backend server. Make sure it is running.";
        errorBox.style.display = "block";
      }
    }
  </script>

</body>
</html>
